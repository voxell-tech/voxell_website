# ==============================================================================
# Tola Configuration (v0.8.0)
# ==============================================================================

[site]
origin = "https://voxell.dev"
title = "Voxell"
description = "Building the next generation of open-source ecosystem for makers."
language = "en"

[build]
# site.typ decides which sources under content/ are published and where.
entry = "site.typ"
content-dir = "content"
publish-dir = "public"

# Tailwind CSS. Make sure tailwindcss is installed: npm install -g tailwindcss
# The output is a build product (gitignored), published by [assets] below.
[[build.hooks.before-build]]
enable = true
name = "tailwind"
command = [
  "tailwindcss",
  "-i", "assets/styles/tailwind.css",
  "-o", "assets/generated/tailwind.css",
]
dev = "run"
rerun-on = ["assets/styles", "shared/styles.css", "shared/site/site.css"]
generates = ["assets/generated/tailwind.css"]

[assets]
# Adds ?h=<hash> to URLs from `url-of-asset` (the stylesheet and favicon).
cache-busting = true
trees = [
  { source = "assets/js", url-prefix = "/js" },
  { source = "assets/images", url-prefix = "/images" },
  { source = "shared/icons", url-prefix = "/icons" },
  { source = "shared/scripts", url-prefix = "/scripts" },
]
files = [
  { source = "assets/generated/tailwind.css", url = "/styles/tailwind.css" },
  { source = "assets/favicon/favicon.ico", url = "/favicon.ico" },
  { source = "assets/robots.txt", url = "/robots.txt" },
  # GitHub Pages custom domain.
  { source = "CNAME", url = "/CNAME" },
]

[server]
interface = "127.0.0.1"
port = 5277

[dev]
watch = true
